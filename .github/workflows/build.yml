name: Build

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Build
        run: gradle clean build shadowJar --no-daemon --stacktrace

      - name: Show jar outputs
        run: |
          find . -name "*.jar" -not -path "*/gradle/wrapper/*" -not -path "*/.gradle/*"

      - name: Upload PermAtlas plugin jar
        uses: actions/upload-artifact@v4
        with:
          name: PermAtlas-plugin
          path: permatlas-plugin/build/libs/*.jar
          if-no-files-found: error
          retention-days: 14

      - name: Upload API jar
        uses: actions/upload-artifact@v4
        with:
          name: PermAtlas-api
          path: permatlas-api/build/libs/*.jar
          if-no-files-found: warn
          retention-days: 14

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.jar
          generate_release_notes: true 